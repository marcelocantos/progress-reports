# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server.
#
# AGENT RULE: Do NOT edit this file directly unless the user explicitly
# instructs you to, or the file is unloadable and you are performing an
# emergency repair. Prefer Bullseye MCP/CLI mutation tools (open/query/
# commit). Direct edits are detected via content_hash below.
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit targets
# only through tools, not these lines.
# content_hash: sha256:6c8be44f3b8ddb10a68f8d910e0fb2bf379b0f2b2a723fd62d24e78261cbe80c

schema_version: 5
targets:
  T1:
    name: gather.sh and timeline-chart.py count every commit in the reporting period (no boundary loss)
    status: identified
    value: 5.0
    cost: 3.0
    acceptance:
    - gather.sh uses explicit timestamped --since/--until (or --after/--before) bounds covering the full first-day and last-day local-tz windows
    - timeline-chart.py applies the same explicit bounds when querying git log per repo per week
    - Re-running the 2026-04-27…05-03 scan from scratch produces a Mon 2026-04-27 commit count consistent with `git log --since="2026-04-27 00:00" --until="2026-04-27 23:59:59"` aggregated across active repos (i.e. matches the hand-patched 19, not the original 2)
    - A short note in docs/methodology.md or docs/guide.md documents the boundary-day pitfall and the explicit-timestamp fix
    context: Both companion scripts use bare-date `--since=YYYY-MM-DD` / `--after=YYYY-MM-DD` in their git-log invocations. Git treats a bare date as "midnight at the local-tz start of that day", but for `--since`/`--after` with `--until`/`--before` ranges this can silently drop commits whose author timestamp lands on the boundary day. During the 2026-04-27…05-03 report run, this caused the daily-activity cache to record Mon 2026-04-27 as 2 commits when the actual count was 19 (the mnemo v0.33.0 release-storm landed early Monday morning AEST). The worker had to hand-patch data/daily-repos.yaml. Fix is to use explicit timestamped strings — e.g. `--since="YYYY-MM-DD 00:00"` and `--until="YYYY-MM-DD 23:59:59"`, or `--after="YYYY-MM-DDT00:00:00+10:00"` etc. — in both gather.sh and timeline-chart.py so report periods cleanly include the first and last day's full 24 hours.
    origin: 2026-05-03 weekly-report run; worker had to hand-patch data/daily-repos.yaml after gather.sh under-counted the Monday boundary day
    discovered: 2026-05-09
  T2:
    name: timeline-chart.py emits per-week SVGs only for completed weeks within the reporting window — no future-period or partial-week files
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - timeline-chart.py only writes per-week SVGs for weeks whose Sunday end-date is ≤ the report's last day
    - Running timeline-chart.py with --until=2026-05-03 on 2026-05-04 produces no daily-activity-2026-05-10.svg
    - Re-running on the same period is idempotent (no spurious files reappear)
    - If the user wants to force-emit an in-progress week, an explicit flag (e.g. --include-current) can be added — but it is OFF by default
    context: timeline-chart.py iterates Mondays from `--since` through `--until` and writes one daily-activity-YYYY-MM-DD.svg per week. When invoked on or after the start of a new week (e.g. running on a Monday for the previous Sunday-ending report), it generates a partial SVG for the in-progress week — the 2026-05-03 report run produced a stale `daily-activity-2026-05-10.svg` for a week that hadn't ended. The worker had to delete it manually before commit. Fix is for timeline-chart.py to cap its weekly-SVG emission at the last Monday whose Sunday is ≤ `--until` (or whose Sunday is ≤ today, whichever is earlier), so partial/future weeks are excluded.
    origin: 2026-05-03 weekly-report run; worker had to delete a stale daily-activity-2026-05-10.svg before commit
    discovered: 2026-05-09
