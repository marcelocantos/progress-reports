schema_version: 5
targets:
  T1:
    name: gather.sh and timeline-chart.py count every commit in the reporting period (no boundary loss)
    status: achieved
    value: 5.0
    cost: 3.0
    attestation: 'Independently verified 2026-11-20 on filler/t1-boundary-loss. `make test`: 12 tests OK, covering both period boundaries, either side of Melbourne midnight, both 2026 DST changes (5 Apr and 4 Oct), author date different from committer date, and merge histories with a slow-clock merge. Each fix was undone one at a time and the test failed for that reason (bare date, `--since` instead of `--since-as-filter`, no TZ, inclusive end, author date, host-zone day buckets); `--until` in timeline-chart.py is redundant with its date filter. Real-repo rerun from scratch, read-only: `timeline-chart.py --since 2026-04-27 --until 2026-05-03` gives Mon 2026-04-27 = 21 active repos, equal to an independent full-history `git log --all --format=%ct` recount (21) and to the author-date recount (21); the original bug recorded 2 and the hand patch 19, the gap being repositories added since May. For 2026-11-09…11-15, loadmon: gather.sh 54 = plain `git log` 54, identical hash sets. Guide 1.2 states the rule. Residue: the /progress-report skill still runs its own unfixed copies (🎯T6), and the two scripts select different commits (🎯T7).'
    acceptance:
    - gather.sh uses explicit timestamped --since/--until (or --after/--before) bounds covering the full first-day and last-day local-tz windows
    - timeline-chart.py applies the same explicit bounds when querying git log per repo per week
    - Re-running the 2026-04-27…05-03 scan from scratch produces a Mon 2026-04-27 commit count consistent with `git log --since="2026-04-27 00:00" --until="2026-04-27 23:59:59"` aggregated across active repos (i.e. matches the hand-patched 19, not the original 2)
    - A short note in docs/methodology.md or docs/guide.md documents the boundary-day pitfall and the explicit-timestamp fix
    context: |-
      Both companion scripts use bare-date `--since=YYYY-MM-DD` / `--after=YYYY-MM-DD` in their git-log invocations. Git treats a bare date as "midnight at the local-tz start of that day", but for `--since`/`--after` with `--until`/`--before` ranges this can silently drop commits whose author timestamp lands on the boundary day. During the 2026-04-27…05-03 report run, this caused the daily-activity cache to record Mon 2026-04-27 as 2 commits when the actual count was 19 (the mnemo v0.33.0 release-storm landed early Monday morning AEST). The worker had to hand-patch data/daily-repos.yaml. Fix is to use explicit timestamped strings — e.g. `--since="YYYY-MM-DD 00:00"` and `--until="YYYY-MM-DD 23:59:59"`, or `--after="YYYY-MM-DDT00:00:00+10:00"` etc. — in both gather.sh and timeline-chart.py so report periods cleanly include the first and last day's full 24 hours.

      Achieved 2026-11-20: Independently verified 2026-11-20 on filler/t1-boundary-loss. `make test`: 12 tests OK, covering both period boundaries, either side of Melbourne midnight, both 2026 DST changes (5 Apr and 4 Oct), author date different from committer date, and merge histories with a slow-clock merge. Each fix was undone one at a time and the test failed for that reason (bare date, `--since` instead of `--since-as-filter`, no TZ, inclusive end, author date, host-zone day buckets); `--until` in timeline-chart.py is redundant with its date filter. Real-repo rerun from scratch, read-only: `timeline-chart.py --since 2026-04-27 --until 2026-05-03` gives Mon 2026-04-27 = 21 active repos, equal to an independent full-history `git log --all --format=%ct` recount (21) and to the author-date recount (21); the original bug recorded 2 and the hand patch 19, the gap being repositories added since May. For 2026-11-09…11-15, loadmon: gather.sh 54 = plain `git log` 54, identical hash sets. Guide 1.2 states the rule. Residue: the /progress-report skill still runs its own unfixed copies (🎯T6), and the two scripts select different commits (🎯T7).
    origin: 2026-05-03 weekly-report run; worker had to hand-patch data/daily-repos.yaml after gather.sh under-counted the Monday boundary day
    discovered: 2026-05-09
    achieved: 2026-11-20
  T2:
    name: timeline-chart.py emits per-week SVGs only for completed weeks within the reporting window — no future-period or partial-week files
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '`make test` ran 8 fixture tests and returned OK. The repo-local timeline CLI emitted only daily-activity-2026-05-03.svg at Melbourne midnight on 2026-05-04 with --until=2026-05-03, on rerun, and with the default cutoff. Fixtures also verified incomplete leading and trailing weeks, a Sunday still in progress and a future week. No in-progress override was requested.'
    acceptance:
    - timeline-chart.py only writes per-week SVGs for weeks whose Sunday end-date is ≤ the report's last day
    - Running timeline-chart.py with --until=2026-05-03 on 2026-05-04 produces no daily-activity-2026-05-10.svg
    - Re-running on the same period is idempotent (no spurious files reappear)
    - If the user wants to force-emit an in-progress week, an explicit flag (e.g. --include-current) can be added — but it is OFF by default
    context: |-
      timeline-chart.py iterates Mondays from `--since` through `--until` and writes one daily-activity-YYYY-MM-DD.svg per week. When invoked on or after the start of a new week (e.g. running on a Monday for the previous Sunday-ending report), it generates a partial SVG for the in-progress week — the 2026-05-03 report run produced a stale `daily-activity-2026-05-10.svg` for a week that hadn't ended. The worker had to delete it manually before commit. Fix is for timeline-chart.py to cap its weekly-SVG emission at the last Monday whose Sunday is ≤ `--until` (or whose Sunday is ≤ today, whichever is earlier), so partial/future weeks are excluded.

      Achieved 2026-11-20: `make test` ran 8 fixture tests and returned OK. The repo-local timeline CLI emitted only daily-activity-2026-05-03.svg at Melbourne midnight on 2026-05-04 with --until=2026-05-03, on rerun, and with the default cutoff. Fixtures also verified incomplete leading and trailing weeks, a Sunday still in progress and a future week. No in-progress override was requested.
    origin: 2026-05-03 weekly-report run; worker had to delete a stale daily-activity-2026-05-10.svg before commit
    discovered: 2026-05-09
    achieved: 2026-11-20
  T3:
    name: 'The repo offers a per-repo view of the series: one summarised journey page per repository, indexed from a top-level document linked in the root README'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'docs/repos/ has 43 populated per-repo journey pages plus a categorised index (docs/repos/README.md); root README links under By Project and from The Journey So Far. Guide section 7 and skill Phase 3 wiring already on master (85c0c5c/b26bf0e). Inclusion rule, alias folds, Standouts/Metrics template reflected in pages. Residual: skill backfill will keep pages fresh on future /progress-report runs.'
    acceptance:
    - 'docs/guide.md section 7 specifies the per-repo pages: inclusion rule (≥2 dedicated weekly sections, aliases folded), page template, weekly maintenance, self-healing backfill sweep, and index format'
    - The /progress-report skill (worker.md + SKILL.md Phase 3) runs the per-repo pass on every normal run — backfill first, then weekly maintenance, then index sync — and stages docs/repos/ with the weekly commit
    - docs/repos/README.md index scaffold exists and the root README links to it
    - After the next /progress-report run, every qualifying repo has a docs/repos/<repo>.md page and the index has no empty categories or pending-backfill note
    context: |-
      Skill-driven by design: all O(n) page writing happens inside normal /progress-report runs via the guide-7.4 backfill sweep; the session only landed O(1) scaffolding (guide section, skill wiring, index stub, README link). No one-off page-generation job exists.

      Achieved 2026-08-02: docs/repos/ has 43 populated per-repo journey pages plus a categorised index (docs/repos/README.md); root README links under By Project and from The Journey So Far. Guide section 7 and skill Phase 3 wiring already on master (85c0c5c/b26bf0e). Inclusion rule, alias folds, Standouts/Metrics template reflected in pages. Residual: skill backfill will keep pages fresh on future /progress-report runs.
    origin: 'User request 2026-07-29: per-repo view of the reports'
    discovered: 2026-07-29
    achieved: 2026-08-02
  T6:
    name: The /progress-report skill runs scripts/gather.sh and scripts/timeline-chart.py from the progress-reports checkout, not stale copies in the skill directory
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`~/.claude/skills/progress-report/worker.md` (and SKILL.md if it names them) invoke `<progress-reports>/scripts/gather.sh` and `<progress-reports>/scripts/timeline-chart.py`; the skill directory no longer ships its own `gather.sh` or `timeline-chart.py`'
    - '`timeline-chart.py` is invoked with `--until <report last Sunday>` as docs/guide.md now specifies'
    - A dry run of the skill's Phase 1 command line, as written in worker.md, resolves to the repo copies (checked with `bash -x` or equivalent), and `make test` in progress-reports is green
    context: 'Found by the independent verification of 🎯T1/🎯T2 on branch filler/t1-boundary-loss (2026-11-20). The fixes for T1 and T2 live in this repo''s `scripts/`, and docs/guide.md and CLAUDE.md point there, but worker.md lines 128 and 220 still run `~/.claude/skills/progress-report/gather.sh` and `timeline-chart.py`. The skill''s timeline-chart.py still passes a bare `--since=<date>` (the original T1 bug) and still emits partial-week SVGs (the original T2 bug), so the next report run reproduces both symptoms. The repo `gather.sh` resolves bounds with `git -C <repo root> rev-parse --since=…`, so it must run from inside a Git checkout; copying it back into the skill directory would fail with `fatal: not a git repository`. The change is in the yadm-tracked skill tree, outside this repository.'
    origin: Independent verification of T1/T2, 2026-11-20
    discovered: 2026-11-20
  T7:
    name: 'Each week''s daily-activity chart has one source: the weekly report''s daily table and reports/daily-activity-&lt;Sunday&gt;.svg show the same counts'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Only one producer writes `reports/daily-activity-<Sunday>.svg` in a report run, or both producers select the same commits (same refs, same merge rule, same repository set)
    - For the week 2026-11-09…11-15, the counts in the published chart equal the `# daily_active_repos` counts the report text is based on, or the guide states why they differ and labels the chart accordingly
    - The reporting oracle checks the chosen rule against a fixture with an unmerged branch, a merge-only day and a stash entry
    context: 'Found by the independent verification of 🎯T1 (2026-11-20). Both producers now agree on period membership (committer timestamp, Melbourne dates, inclusive first midnight, exclusive following midnight), but they select different commits. `gather.sh` counts non-merge commits on the default branch; `daily-chart.py` charts that into `reports/daily-activity-<Sunday>.svg` (guide 3.7). `timeline-chart.py --weekly-dir` later overwrites the same file with counts from `git log --all`, which includes merges, unmerged branches and `refs/stash`, and it prunes fewer build directories (`vendor node_modules .build build`) than `gather.sh` (which also prunes Build, Builds, Library, Temp, obj, Pods and DerivedData). For 2026-11-09…11-15, read-only today: `gather.sh` daily 11, 9, 5, 8, 5, 4, 9; `timeline-chart.py` 15, 11, 9, 10, 7, 6, 14. This predates the T1 branch.'
    origin: Independent verification of T1/T2, 2026-11-20
    discovered: 2026-11-20
