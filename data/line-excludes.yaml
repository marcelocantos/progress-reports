# Line-stat excludes for progress-report gather.sh.
# Paths are git pathspec globs, relative to each repo root.
# Commits still count toward ℂ; only ☲ (insertions/deletions) is filtered.
#
# Global defaults (always applied, even without this file):
#   **/vendor/**
#   **/node_modules/**
#
# Extra globals, merged with the hard-coded defaults. These are
# machine-maintained files that must stay committed but are never
# hand-authored: dependency lockfiles are written by the package manager, and
# bullseye.yaml is written by the bullseye MCP server (hand-editing it is
# forbidden by the repo rules). A single dependency pull can move hundreds of
# lockfile lines, and one target-ledger update over a thousand yaml lines,
# swamping the authored diff it accompanies.
defaults:
  - '**/bullseye.yaml'
  - '**/Cargo.lock'
  - '**/go.sum'
  - '**/package-lock.json'
  - '**/uv.lock'
  - '**/poetry.lock'
  - '**/pubspec.lock'

# Per-repo extras keyed by org/repo (same label gather.sh prints):

repos:
  squz/ge:
    - verdicts/**
    - sample/tiltbuggy/fixtures/**
    # headers/ is a generated mirror: tools/lift-headers.sh copies the public
    # header subset of every vendor submodule (asio, sdl3, spdlog, box2d, ...)
    # into the tree so consumer iOS CI can check out ge non-recursively.
    # prebuilt/ is LFS-pointer libge.a plus binary cook manifests, recooked on
    # every engine change. Neither is authored.
    - headers/**
    - prebuilt/**

  squz/yourworld2:
    - golden/**
    - docs/golden/**
    - ge/verdicts/**
    # per-device layout measurement dumps (~51k lines in the week of 2026-11-09)
    - tests/layout/reports/**

  squz/multimaze2:
    - golden/**

  marcelocantos/rustuml:
    - test-diagrams/**
    - test-fixtures/**
    # 2026-11 parity campaign: docs/parity-reviews/ is ~11.5M lines of
    # machine-written per-diagram review records; tools/font-chain-reference/
    # holds generated font-metric reference dumps; third_party/ is vendored.
    - docs/parity-reviews/**
    - tools/font-chain-reference/**
    - third_party/**

  # player/vendor is already covered by **/vendor/**; listed for documentation.
  marcelocantos/spyder:
    - player/vendor/**

  # dist/ is the auto-generated single-file amalgamation ("Auto-generated by
  # scripts/amalgamate.py - do not edit"), so every src/ change lands twice.
  marcelocantos/csp:
    - dist/**

  # The global **/vendor/** pathspec is case-sensitive and does not match
  # capital-V Vendor. This tree is ~330k lines (sqlite3.c alone is 261k).
  # docs/audits/**/*.json is generated suite/fidelity maps (legacy-suites.json
  # ~13k, map.json ~19k), not authored product.
  marcelocantos/jevons:
    - ios/Vendor/**
    - docs/audits/**/*.json
    # Android widget native layer (2026-10-29): third-party and amalgamated
    # C/C++ copied in for the JNI build: sqlite3 amalgamation (261k),
    # nlohmann/json, lz4, the sqlpipe amalgamation and the generated
    # deepparser (Lemon) tree. device_store.cpp and CMakeLists stay in ☲.
    - mobile/android/app/src/main/cpp/include/**
    - mobile/android/app/src/main/cpp/deepparser/**
    - mobile/android/app/src/main/cpp/sqlite3.*
    - mobile/android/app/src/main/cpp/sqlpipe.*
    - mobile/android/app/src/main/cpp/lz4.*

  # Generated 41 MB C blob embedding the Ruby bundle.
  marcelocantos/den:
    - src/ruby/bundle_data.c

  # Vendored Facebook zstd amalgamation bound via cgo (zstd.c is ~52k lines).
  marcelocantos/mnemo:
    - internal/zstdc/zstd.c
    - internal/zstdc/zstd.h

  # Disk-audit snapshots: du TSV dumps and rescued git-stash patches from
  # other trees (one yourworld stash is 212k lines). Not authored product.
  marcelocantos/housekeeping:
    - snapshots/**

  # Pinned third-party language corpora (Postgres regress, W3C xmlts, CLDR,
  # JUnit POM, CPython, CommonMark, gcc testsuite snippets). Not authored.
  marcelocantos/xbnf:
    - eval/testdata/*/corpus/**
    # Pinned arr.ai stdlib used as the fromwbnf tree oracle (syntax/stdlib
    # on arr.ai master). Not authored. SOURCES.md beside it is the pin note
    # and stays in ☲.
    - fromwbnf/testdata/arrai/stdlib/**

  # Reconstruct bench fixture: a 85k-line checked-in protobuf dump plus a
  # vendored sysl-in-arrai tree used only as the workload, not product source.
  arr-ai/arrai:
    - perf/reconstruct/model.sysl.pb
    - perf/reconstruct/vendor/**

  # ios/build-spm-check is a Swift Package Manager build tree that was briefly
  # tracked before "Stop tracking ios/build-spm-check SPM build tree" removed
  # it: ~5,000 machine-written files (module caches, .build intermediates).
  marcelocantos/orthograph:
    - ios/build-spm-check/**

  # The report series itself. Weekly reports, per-repo pages and achievement
  # lists are narrative *about* the work, not the work — and each week's prose
  # is already accounted for once, in the week it describes. The 2026-08 split
  # into a public/private pair rewrote the public repo's history, so a single
  # commit re-adds the whole back-catalogue (+59k). Counting that would double
  # count every earlier week.

  # Synced third-party Anthropic/office skill trees (ISO OOXML XSDs, validators,
  # docx/pptx/xlsx helpers). Copied wholesale by "Update skills from ~/.claude/skills";
  # not authored product. A single sync can move ~80k lines of schema.
  marcelocantos/skills:
    - skills/synced/**

  marcelocantos/progress-reports:
    - reports/**
    - docs/**
  marcelocantos/progress-reports-private:
    - reports/**
    - docs/**

  # Unity track assets: 4,020 files / ~209 kloc in the 3.26 squash (Night +
  # Derby scenery). Authored C# / tests / release tooling stay in ☲.
  minicadesmobile/stock-car-racing:
    - Assets/Tracks/**

  # Personal knowledge vault, first cloned under the scan root on 2026-10-18.
  # knowledge/youtube/ is automated transcript ingestion (~+505k lines in one
  # week), not authored source.
  marcelocantos/think:
    - knowledge/youtube/**
    # analysis/ holds machine-generated session-mining and audit dumps
    # (~1M lines in the week of 2026-11-02).
    - analysis/**

  # fastlane match signing repo, new on 2026-10-25. profiles/ and certs/ hold
  # match-encrypted provisioning profiles, .p12 and .cer blobs that fastlane
  # writes; only README.md and match_version.txt are authored.
  canticode/certs:
    - profiles/**
    - certs/**

  # Lifted Graphviz/expat C trees, embedded assets and generated font-data
  # tables from the Java-to-Go port; not authored product.
  marcelocantos/gouml:
    - third_party/**
    - pu/assets/**
    - rt/fontdata_*.go
    - gv/textlayout_fonts.c
    # pu/ is the transpiler's output ("never edited by hand; make gen
    # regenerates it"): ~270k lines in the week the repo began.
    - pu/**
    - test-diagrams/**

  # hms2 port tooling: oracle/evidence is captured Delphi evidence (6.3M lines
  # deleted in one tidy-up), portsets/ are generated coverage ledgers and
  # transpiler/generated holds emitted C# stubs.
  Health-Management-Systems/hms:
    - hms2/tools/oracle/evidence/**
    - hms2/tools/transpiler/portsets/**
    - hms2/tools/transpiler/generated/**

  # t3-highlights ships a vendored highlights.c (~151k lines) under a
  # capital-V Vendor directory that the global **/vendor/** glob does not match.
  marcelocantos/t3code:
    - apps/mobile/modules/t3-highlights/Vendor/**

  # research/perf-compare/results holds raw benchmark output dumps (~38k lines
  # per rerun), not authored source.
  marcelocantos/go-decimal-proposal:
    - research/perf-compare/results/**

  # licenses/ holds generated dependency licence bundles and provenance.
  canticode/orthograph:
    - licenses/**

  # Generated dependency licence listing.
  marcelocantos/bullseye:
    - THIRDPARTY.txt

  # Generated third-party licence listing for the bundled editor.
  marcelocantos/vellum:
    - viewer/editor/THIRD_PARTY_LICENSES.txt
