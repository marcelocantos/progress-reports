# Line-stat excludes for progress-report gather.sh.
# Paths are git pathspec globs, relative to each repo root.
# Commits still count toward ℂ; only ☲ (insertions/deletions) is filtered.
#
# Global defaults (always applied, even without this file):
#   **/vendor/**
#   **/node_modules/**
#
# Extra globals, merged with the hard-coded defaults. These are
# machine-maintained files that must stay committed but are never
# hand-authored: dependency lockfiles are written by the package manager, and
# bullseye.yaml is written by the bullseye MCP server (hand-editing it is
# forbidden by the repo rules). A single dependency pull can move hundreds of
# lockfile lines, and one target-ledger update over a thousand yaml lines,
# swamping the authored diff it accompanies.
defaults:
  - '**/bullseye.yaml'
  - '**/Cargo.lock'
  - '**/go.sum'
  - '**/package-lock.json'
  - '**/uv.lock'
  - '**/poetry.lock'

# Per-repo extras keyed by org/repo (same label gather.sh prints):

repos:
  squz/ge:
    - verdicts/**
    - sample/tiltbuggy/fixtures/**
    # headers/ is a generated mirror: tools/lift-headers.sh copies the public
    # header subset of every vendor submodule (asio, sdl3, spdlog, box2d, ...)
    # into the tree so consumer iOS CI can check out ge non-recursively.
    # prebuilt/ is LFS-pointer libge.a plus binary cook manifests, recooked on
    # every engine change. Neither is authored.
    - headers/**
    - prebuilt/**

  squz/yourworld2:
    - golden/**
    - docs/golden/**
    - ge/verdicts/**

  squz/multimaze2:
    - golden/**

  marcelocantos/rustuml:
    - test-diagrams/**
    - test-fixtures/**

  # player/vendor is already covered by **/vendor/**; listed for documentation.
  marcelocantos/spyder:
    - player/vendor/**

  # dist/ is the auto-generated single-file amalgamation ("Auto-generated by
  # scripts/amalgamate.py - do not edit"), so every src/ change lands twice.
  marcelocantos/csp:
    - dist/**

  # The global **/vendor/** pathspec is case-sensitive and does not match
  # capital-V Vendor. This tree is ~330k lines (sqlite3.c alone is 261k).
  marcelocantos/jevons:
    - ios/Vendor/**

  # Generated 41 MB C blob embedding the Ruby bundle.
  marcelocantos/den:
    - src/ruby/bundle_data.c

  # ios/build-spm-check is a Swift Package Manager build tree that was briefly
  # tracked before "Stop tracking ios/build-spm-check SPM build tree" removed
  # it: ~5,000 machine-written files (module caches, .build intermediates).
  marcelocantos/orthograph:
    - ios/build-spm-check/**

  # The report series itself. Weekly reports, per-repo pages and achievement
  # lists are narrative *about* the work, not the work — and each week's prose
  # is already accounted for once, in the week it describes. The 2026-08 split
  # into a public/private pair rewrote the public repo's history, so a single
  # commit re-adds the whole back-catalogue (+59k). Counting that would double
  # count every earlier week.
  marcelocantos/progress-reports:
    - reports/**
    - docs/**
  marcelocantos/progress-reports-private:
    - reports/**
    - docs/**
